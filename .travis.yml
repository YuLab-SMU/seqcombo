## reference: http://docs.travis-ci.com/user/languages/r/

language: r
r:
  - bioc-release

os:
  - linux
  - osx

cache: packages
bioc_required: true

env:
  global:
    - _R_CHECK_FORCE_SUGGESTS_=False
    - R_LIBS="http://cran.rstudio.com"


after_failure:
  - ./travis-tool.sh dump_logs

