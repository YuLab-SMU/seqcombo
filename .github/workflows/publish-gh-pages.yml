name: Publish Vignette to GitHub Pages

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  publish-gh-pages:
    if: github.ref != 'refs/heads/gh-pages'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system libraries for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            github::YuLab-SMU/yulab.utils
          needs: vignettes

      - name: Build vignette site
        shell: bash
        run: |
          QUARTO_CACHE="$GITHUB_WORKSPACE/.quarto-cache"
          QUARTO_LIB="$GITHUB_WORKSPACE/.quarto-lib"
          mkdir -p "$QUARTO_CACHE" "$QUARTO_LIB" .site
          QUARTO_R_LIBS=$(QUARTO_LIB="$QUARTO_LIB" Rscript -e 'cat(paste(c(normalizePath(Sys.getenv("QUARTO_LIB"), winslash = "/", mustWork = TRUE), .libPaths()), collapse = .Platform$path.sep))')
          R CMD INSTALL -l "$QUARTO_LIB" .
          cd vignettes
          R_LIBS="$QUARTO_R_LIBS" XDG_CACHE_HOME="$QUARTO_CACHE" LOCALAPPDATA="$QUARTO_CACHE" quarto render seqcombo.qmd --to html
          mv seqcombo.html ../.site/index.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./.site
          force_orphan: true
